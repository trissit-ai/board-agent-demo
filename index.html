 * @returns {boolean} 是否执行成功
 */
function runEngineStep(forcedStep) {
  const cfg = state.config;
  const eng = state.engine;
  const step = forcedStep || (eng.stepIndex % 8) + 1;
  eng.stepIndex = step;
  const loopItem = (cfg.loop || [])[step - 1] || { id: 'STEP', name: '模拟', output: '' };
  const event = eng.injectedEvent || selectedEvent();
  const pool = filteredCards();
  const focus = pool.find((c) => cardMatchesEvent(c, event)) || pool[0] || { card_id: '-', board_id: 'GLOBAL', run: { run_id: '-' } };
  const base = { board_id: focus.board_id, card_id: focus.card_id, run_id: (focus.run || {}).run_id || '-', actor: '规则模拟引擎' };
  const ip = cfg.thresholds || {};
  const dedupKey = String(event.event_id || '') + '|v' + String(event.version || 1);
  let reason = '';
  let action = loopItem.id;

  switch (step) {
    case 1: { // Observe：幂等去重
      if (eng.dedupKeys.has(dedupKey)) {
        action = 'IDEMPOTENT_DROP';
        reason = 'Observe：事件 ' + dedupKey + ' 重复到达，按 event_id + version + 幂等键去重丢弃，不重复建卡';
        eng.failures += 1;
      } else {
        eng.dedupKeys.add(dedupKey);
        reason = 'Observe：读取事件 ' + dedupKey + '（来源 ' + (event.source || '演示源-A') + '）与板面差异，生成已去重快照；数据源为本地只读投影';
      }
      break;
    }
    case 2: { // Evaluate：SLA / WIP / 依赖 / 风险分级
      const risky = pool.filter((c) => c.risk === '高').length;
      const overdue = pool.filter((c) => Number(c.slaRemainingHours || 0) <= Number(ip.slaCriticalHours || 1) && c.state !== 'Done' && c.state !== 'Archived').length;
      const running = pool.filter((c) => c.state === 'Running').length;
      const blocked = pool.filter((c) => c.state === 'Blocked').length;
      reason = 'Evaluate：SLA 危急 ' + overdue + ' 张、高风险 ' + risky + ' 张、Running ' + running + '／WIP ' + fmtNum(ip.wipGlobal) +
        '、Blocked ' + blocked + ' 张；按依赖图核验，风险分级为' + (risky > 0 ? '高' : '中') + '，所有数值为' + cfg.meta.demoNotice;
      break;
    }
    case 3: { // Plan：最小下一步（建卡 / 合并 / 拆卡 / 升优先级）
      eng.rounds += 1;
      if (eng.injectedEvent && !(cfg.cards || []).some((c) => ((c.linkedIds || {}).eventIds || []).includes(eng.injectedEvent.event_id))) {
        const e = eng.injectedEvent;
        const typeDef = (cfg.eventTypes || []).find((t) => t.type === e.event_type) || {};
        const newCard = {
          card_id: shortId('C-SIM'), board_id: e.board_id || typeDef.defaultBoard || 'B1',
          title: '规则模拟：' + (typeDef.name || e.event_type) + '影响核验',
          goal: '由注入事件生成的最小下一步，仅做只读影响核验，不执行任何外部动作',
          scope: '市场 A · 车型 A · 演示范围', owner: '规则模拟 Owner A', agent: '预测与异常检测',
          priority: 'P2', risk: '中', slaHours: 24, slaRemainingHours: 24,
          dependencies: [], acceptance: ['影响范围清单', '来源与版本证据'],
          state: 'Triage', evidence: [], run: { run_id: '', role: '', heartbeat: '', progress: 0, budget: 0, toolCalls: [], result: '尚未创建运行实例' },
          timeline: [{ at: nowTime().slice(0, 5), actor: '规则模拟引擎', action: '自动建卡', detail: 'Plan 步生成最小下一步：建卡（去重后）' }],
          linkedIds: { vin: ((e.linkedIds || {}).vin || []).slice(), orderIds: ((e.linkedIds || {}).orderIds || []).slice(), eventIds: [e.event_id], entityId: e.entity_id || '' },
          humanGate: '', blockedReason: '', dedup: true, sim: true, dataTag: cfg.meta.demoNotice
        };
        cfg.cards.push(newCard);
        reason = 'Plan：生成最小下一步＝建卡 ' + newCard.card_id + '（' + newCard.board_id + '）；不重复建卡、不拆无谓子卡，验收条件随卡定义';
      } else {
        reason = 'Plan：已达到最大规划轮次 ' + fmtNum(ip.maxRounds) + ' 的收敛检查；无需新增卡片，沿用现有队列并合并重复项，避免制造繁忙';
      }
      break;
    }
    case 4: { // Authorize：自治等级与风险决定自动执行或审批请求
      const board = boardById(focus.board_id);
      if (isHighRisk(focus) || board.autonomyLevel === 'L1') {
        const exists = (cfg.approvals || []).some((a) => a.card_id === focus.card_id && a.gate === 'Review' && a.decision === '待处理');
        if (!exists) {
          (cfg.approvals || []).push({
            id: shortId('AP-SIM'), gate: 'Review', board_id: focus.board_id, card_id: focus.card_id,
            title: '规则模拟审批请求：' + (focus.title || focus.card_id),
            reason: '自治等级 ' + board.autonomyLevel + ' 且动作命中高风险词表，Authorize 拒绝自动执行',
            impact: '停在 Review 等待人工门；规则引擎永远不得自动 Done',
            evidence: ['规则模拟差异报告', '风险分级记录'], deadline: '按板 SLA',
            overdueConsequence: '保持 Review，超时升级至 Arbitration',
            requester: '规则模拟引擎', approver: focus.owner || '业务负责人 A', decision: '待处理',
            sim: true, dataTag: cfg.meta.demoNotice
          });
        }
        action = 'AUTH_HOLD';
        reason = 'Authorize：高风险动作或 L1 板面，生成 Review 审批请求并暂停自动执行；模拟产出标注「' + cfg.meta.simNotice + '」';
      } else {
        reason = 'Authorize：自治等级 ' + board.autonomyLevel + '、风险可控、预算 ' + fmtNum(ip.budgetPerRun) + '／次在范围内，允许只读核验类动作自动执行';
      }
      break;
    }
    case 5: { // Dispatch：选角色、创建 run 实例、受 WIP 限制
      const board = boardById(focus.board_id);
      const used = (cfg.cards || []).filter((c) => c.board_id === focus.board_id && c.state === 'Running').length;
      if (used >= Number(board.wipLimit || 3)) {
        action = 'DISPATCH_BLOCK';
        reason = 'Dispatch：本板 WIP ' + used + '/' + board.wipLimit + ' 已满，升级人工而非盲目排队；无合适角色同样升级';
        eng.failures += 1;
      } else {
        const group = (cfg.roles.groups || [])[0] || {};
        const role = ((group.subRoles || [])[0] || {}).name || '共享专业角色';
        reason = 'Dispatch：选择「' + role + '」共享池角色，创建按需运行实例与幂等键；WIP ' + used + '/' + board.wipLimit + '，实例完成后释放';
        if (!focus.run) focus.run = {};
        if (!focus.run.run_id) focus.run.run_id = shortId('RUN-SIM');
      }
      break;
    }
    case 6: { // Monitor：心跳、进度、重试、熔断
      const circuit = eng.failures >= Number(ip.circuitBreakerRepeatFailures || 3) ||
        eng.rounds > Number(ip.maxRounds || 6) ||
        Number(ip.budgetPerBoard || 200) <= 0;
      const depRing = detectDependencyRing();
      if (circuit || depRing) {
        action = 'CIRCUIT_BREAK';
        reason = 'Monitor：检测到' + (depRing ? '依赖环' : '重复失败／最大轮次／预算耗尽') + '，熔断并升级人工；撤销凭据、停止实例、保留现场（规则模拟）';
        (cfg.approvals || []).push({
          id: shortId('AP-KILL'), gate: 'Kill', board_id: focus.board_id, card_id: focus.card_id,
          title: '规则模拟熔断升级', reason: '达到停止条件，需要人工停用与恢复确认',
          impact: '停止相关运行实例，保留证据转人工流程', evidence: ['熔断检测结果', '当前运行实例清单'],
          deadline: '立即', overdueConsequence: '立即停止并启动业务补救与审计复核',
          requester: '治理与风险监测', approver: '业务负责人 A', decision: '待处理',
          sim: true, dataTag: cfg.meta.demoNotice
        });
        pauseEngine();
        toast('规则模拟触发熔断并升级人工（规则模拟 / 虚构数据）', 'warn');
      } else {
        reason = 'Monitor：心跳正常、进度推进，剩余预算充足；重复失败 ' + eng.failures + '／' + fmtNum(ip.circuitBreakerRepeatFailures) +
          '，最大轮次 ' + fmtNum(ip.maxRounds) + '，重试上限 ' + fmtNum(ip.maxRetries) + '；未发现依赖环';
      }
      break;
    }
    case 7: { // Review：证据齐全才允许提交验收，人工门，绝不自动 Done
      const ev = focus.evidence || [];
      if (!ev.length) {
        action = 'REVIEW_EVIDENCE_MISSING';
        reason = 'Review：产物或证据不足，不得提交验收、不得 Done；卡片保持原状态并生成补件清单（规则模拟）';
        eng.failures += 1;
      } else {
        action = 'REVIEW_GATE';
        reason = 'Review：产物与证据已齐，提交人工验收请求；' +
          (isHighRisk(focus) ? '命中高风险词表，必须停在 Review 等待规定的人批准' : '等待规定的人或规则验收') +
          '，规则引擎永远不得自动 Done';
      }
      break;
    }
    default: { // Learn：写回策略记忆 / 审计
      action = 'LEARN';
      const pv = 'PV-1.' + (2 + eng.rounds);
      reason = 'Learn：把经批准的反馈与案例写回策略记忆，策略版本 ' + pv + '；高风险策略变更必须另行审批；完成一轮闭环（规则模拟 / 虚构数据）';
      pushAudit(Object.assign({}, base, { action, reason, policyVersion: pv, actor: '规则模拟引擎' }), true);
      eng.stepIndex = 0;
      eng.lastReasons.push(reason);
      if (state.view === '架构与治理' || state.view === '演示控制台') renderView();
      else renderTracePanel();
      return true;
    }
  }

  pushAudit(Object.assign({}, base, { action, reason, actor: '规则模拟引擎' }), true);
  eng.lastReasons.push(reason);
  if (state.view === '架构与治理' || state.view === '演示控制台') renderView();
  else renderTracePanel();
  return true;
}

/**
 * 依赖环检测（DFS，纯前端图算法）。
 * @returns {boolean} 是否存在环
 */
function detectDependencyRing() {
  const map = new Map();
  (state.config.cards || []).forEach((c) => map.set(c.card_id, c.dependencies || []));
  const visiting = new Set();
  const visited = new Set();
  let ring = false;
  const dfs = (id) => {
    if (visiting.has(id)) { ring = true; return; }
    if (visited.has(id)) return;
    visiting.add(id);
    (map.get(id) || []).forEach(dfs);
    visiting.delete(id);
    visited.add(id);
  };
  map.forEach((_, id) => { if (!ring) dfs(id); });
  return ring;
}

/** 连续播放。 */
function playEngine() {
  if (state.engine.running) return;
  state.engine.running = true;
  state.engine.timer = window.setInterval(() => runEngineStep(), Number(state.engine.speed));
  if (state.view === '演示控制台') renderView();
  toast('规则模拟连续播放已启动（规则模拟 / 虚构数据）', 'ok');
}

/** 暂停播放。 */
function pauseEngine() {
  state.engine.running = false;
  if (state.engine.timer) window.clearInterval(state.engine.timer);
  state.engine.timer = null;
  if (state.view === '演示控制台') renderView();
}

/** 重置引擎会话（不影响已落盘卡片）。 */
function resetEngine() {
  pauseEngine();
  state.engine.stepIndex = 0;
  state.engine.rounds = 0;
  state.engine.failures = 0;
  state.engine.dedupKeys.clear();
  state.engine.lastReasons = [];
  state.engine.injectedEvent = null;
  pushAudit({ board_id: 'GLOBAL', card_id: '-', action: 'ENGINE_RESET', reason: '规则模拟引擎会话已重置，去重键集合清空；卡片与配置保持不变', actor: '演示控制台' }, false);
  renderView();
  toast('规则模拟引擎已重置', 'ok');
}

/**
 * 注入事件模板，生成新的 event_id / version / trace_id 与发生时间。
 * @param {string} templateId 模板 ID
 */
function injectEvent(templateId) {
  const tpl = (state.config.eventTemplates || []).find((t) => t.id === templateId) || (state.config.eventTemplates || [])[0];
  if (!tpl) { toast('没有可用的事件模板', 'err'); return; }
  const version = Number(tpl.version || 1) + 1;
  const event = deepCopy(tpl);
  event.event_id = 'EVT-SIM-' + String(Date.now()).slice(-6);
  event.version = version;
  event.trace_id = shortId('TRC-SIM');
  event.occurred_at = new Date().toISOString().slice(0, 19);
  event.name = (tpl.name || tpl.event_type) + '（注入副本）';
  event.sim = true;
  event.note = state.config.meta.simNotice;
  state.engine.injectedEvent = event;
  state.selectedEventId = event.event_id;
  pushAudit({ board_id: event.board_id || 'B1', card_id: '-', run_id: '-', action: 'EVENT_INJECT',
    reason: '注入事件 ' + event.event_id + ' v' + version + '（' + event.event_type + '，来源 ' + event.source + '）；等待 Observe 幂等去重',
    actor: '演示控制台' }, true);
  renderView();
  toast('事件已注入：' + event.event_id + '，可在「单步推进」中观察八步闭环（规则模拟 / 虚构数据）', 'ok');
}

/**
 * 审批决策。
 * @param {string} id 审批 ID
 * @param {string} decision 批准 / 驳回
 */
function handleApproval(id, decision) {
  const ap = (state.config.approvals || []).find((a) => a.id === id);
  if (!ap) { toast('未找到审批条目', 'err'); return; }
  ap.decision = decision;
  const card = (state.config.cards || []).find((c) => c.card_id === ap.card_id);
  if (decision === '批准') {
    if (card) {
      card.approvedBy = ap.approver;
      if (!Array.isArray(card.evidence)) card.evidence = [];
      if (!card.evidence.some((e) => e.systemReceipt)) {
        card.evidence.push({ id: shortId('EV'), name: '人工批准回执（规则模拟）', version: 'v1', uri: '本地演示／回执', systemReceipt: true, reviewer: ap.approver, reviewedAt: nowTime().slice(0, 5) });
      }
      if (!Array.isArray(card.timeline)) card.timeline = [];
      card.timeline.push({ at: nowTime().slice(0, 5), actor: ap.approver, action: '人工门批准', detail: ap.title + '；保留审批人与决策理由' });
    }
    pushAudit({ board_id: ap.board_id, card_id: ap.card_id, action: 'HUMAN_GATE_APPROVED', reason: '人工批准 ' + ap.title + '；审批人 ' + ap.approver + '；高风险动作仍需验收并写回', actor: ap.approver }, false);
    toast('已批准：' + ap.title + '（规则模拟 / 虚构数据）', 'ok');
  } else {
    if (card) {
      card.rejectReason = card.rejectReason || ('人工门驳回：' + ap.title);
      card.rejectChecklist = ['补充产物与证据', '重新核对验收条件'];
    }
    pushAudit({ board_id: ap.board_id, card_id: ap.card_id, action: 'HUMAN_GATE_REJECTED', reason: '人工驳回 ' + ap.title + '；生成补件清单，卡片不得 Done', actor: ap.approver }, false);
    toast('已驳回：' + ap.title, 'warn');
  }
  commitConfig(['approvals', 'cards'], '审批决策 ' + decision);
  renderView();
}

/**
 * 卡片流转入口，处理需要额外输入的两个特殊转换。
 * @param {string} cardId 卡片 ID
 * @param {string} to 目标状态
 */
function handleTransition(cardId, to) {
  const card = (state.config.cards || []).find((c) => c.card_id === cardId);
  if (!card) { toast('未找到卡片', 'err'); return; }
  if (card.state === 'Running' && to === 'Blocked') {
    openFormModal('记录阻塞三要素（Running → Blocked 守卫）', [
      { key: 'missing', label: '缺什么', value: '缺 CRM-A 客户语言偏好字段', type: 'text' },
      { key: 'unblocker', label: '谁能解除', value: card.owner || '业务负责人 A', type: 'text' },
      { key: 'escalate', label: '何时升级', value: 'SLA 到期前 2 小时', type: 'text' }
    ], (values) => {
      card.blockedReason = '缺 ' + (values.missing || '资料') + '；解除人：' + (values.unblocker || card.owner) + '；升级时点：' + (values.escalate || 'SLA 到期前');
      card.blockCount = Number(card.blockCount || 0) + 1;
      commitConfig(['cards'], '记录阻塞三要素');
      transitionCard(cardId, to, '人工接管');
    });
    return;
  }
  if (card.state === 'Blocked' && to === 'Ready') {
    openFormModal('Unblock：补齐阻塞缺口（Blocked → Ready 守卫）', [
      { key: 'note', label: '补齐说明与解除人确认', value: '已补齐 CRM-A 客户语言偏好字段，由 ' + (card.owner || '业务负责人 A') + ' 确认', type: 'textarea' }
    ], (values) => {
      card.unblockNote = values.note || '缺口已补齐并确认';
      if (!Array.isArray(card.timeline)) card.timeline = [];
      card.timeline.push({ at: nowTime().slice(0, 5), actor: '人工接管', action: 'Unblock', detail: card.unblockNote + '；不重做整条链' });
      commitConfig(['cards'], '解除阻塞');
      transitionCard(cardId, to, '人工 Unblock');
    });
    return;
  }
  if (card.state === 'Blocked' && to === 'Triage') {
    openFormModal('反复阻塞：退回分流重新定义（Blocked → Triage 守卫）', [
      { key: 'reason', label: '重新定义原因', value: '反复阻塞，目标或输入需要重新确认', type: 'textarea' }
    ], (values) => {
      card.redefineReason = values.reason || '反复阻塞，重新定义';
      card.blockCount = Number(state.config.thresholds.circuitBreakerRepeatFailures || 3);
      commitConfig(['cards'], '退回分流');
      transitionCard(cardId, to, '人工接管');
    });
    return;
  }
  if (card.state === 'Review' && to === 'Done') {
    toast('请点击「人工验收」按钮，由人工门处理 Review → Done', 'warn');
    return;
  }
  if (card.state === 'Review' && to === 'Running') {
    openFormModal('驳回并评论（Review → Running 守卫）', [
      { key: 'reason', label: '驳回理由', value: '证据不足，需要补充来源版本', type: 'textarea' },
      { key: 'checklist', label: '补件清单（顿号分隔）', value: '补充来源版本、核对新 ETA', type: 'text' }
    ], (values) => {
      card.rejectReason = values.reason || '证据不足';
      card.rejectChecklist = String(values.checklist || '').split(/[、,，]/).map((s) => s.trim()).filter(Boolean);
      if (!card.rejectChecklist.length) card.rejectChecklist = ['补充证据'];
      commitConfig(['cards'], '记录驳回理由与补件清单');
      transitionCard(cardId, to, '人工验收驳回');
    });
    return;
  }
  transitionCard(cardId, to, '人工流转');
}

/**
 * 应用配置字段编辑（不整页重绘，保留输入焦点与滚动位置）。
 * @param {HTMLElement} el 输入元素
 */
function applyConfigEdit(el) {
  const path = el.getAttribute('data-edit');
  const ftype = el.getAttribute('data-ftype') || 'text';
  if (!path) return;
  let value;
  if (ftype === 'number') value = Number(el.value);
  else if (ftype === 'bool') value = el.value === 'true';
  else if (ftype === 'list') value = String(el.value).split(/[、,，]/).map((s) => s.trim()).filter(Boolean);
  else value = el.value;
  if (ftype === 'number' && !Number.isFinite(value)) { toast('请输入合法数字', 'err'); return; }
  setPath(state.config, path, value);
  commitConfig([path], '编辑 ' + path);
  const row = el.closest('.edit-row');
  if (row) {
    const badge = row.querySelector('.tag');
    if (badge) { badge.className = 'tag tag-custom'; badge.textContent = state.config.meta.customNotice; }
    else {
      // 预置值默认不显示角标；被编辑后在该行补出「自定义」标签。
      const label = row.querySelector('label');
      const span = document.createElement('span');
      span.className = 'tag tag-custom';
      span.textContent = state.config.meta.customNotice;
      if (label) label.appendChild(span);
    }
  }
  const be = el.closest('.board-edit');
  if (be) {
    const head = be.querySelector('.be-head');
    if (head && !head.querySelector('.tag-custom')) {
      const span = document.createElement('span');
      span.className = 'tag tag-custom';
      span.textContent = state.config.meta.customNotice;
      head.appendChild(span);
    }
  }
}

/** 应用 I_peak 参数变更并重算。 */
function applyCalcEdit(el) {
  const key = el.getAttribute('data-calc');
  if (!key) return;
  const value = Number(el.value);
  if (!Number.isFinite(value)) { toast('请输入合法数字', 'err'); return; }
  setPath(state.config, 'thresholds.iPeak.' + key, value);
  const ip = state.config.thresholds.iPeak || {};
  const peak = Math.ceil(Number(ip.lambda) * Number(ip.S) / 60 * Number(ip.M) * Number(ip.K));
  ip.peakSlots = peak;
  const out = $('#ipeak-out');
  if (out) out.textContent = fmtNum(peak);
  commitConfig(['thresholds.iPeak.' + key, 'thresholds.iPeak.peakSlots'], 'I_peak 重算 ' + fmtNum(peak));
}

/** 导出配置为本地 JSON 文件（Blob，不产生任何外链请求）。 */
function exportConfig() {
  const text = JSON.stringify(state.config, null, 2) + '\n';
  const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'config.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('已导出 config.json（本地文件，无外部请求）', 'ok');
}

/** 恢复初始状态：以内嵌默认快照为准并落盘。 */
async function resetConfig() {
  const base = deepCopy(FALLBACK_CONFIG || state.config);
  state.config = base;
  state.customPaths.clear();
  state.boardFilter = 'ALL';
  state.templateFilter = 'ALL';
  state.columnsMode = Number((base.ui || {}).defaultColumnsMode || 6);
  state.selectedCardId = '';
  state.selectedEventId = (base.eventTemplates || [])[0] ? base.eventTemplates[0].event_id : '';
  state.consoleTab = '规则引擎';
  pauseEngine();
  state.engine.stepIndex = 0;
  state.engine.rounds = 0;
  state.engine.failures = 0;
  state.engine.dedupKeys.clear();
  state.engine.injectedEvent = null;
  if (!state.readonly) {
    const ok = await commitConfig([], '恢复初始状态');
    if (!ok) { toast('重置未落盘，仅当前会话生效', 'warn'); }
  } else {
    toast(state.config.meta.readonlyNotice + '；恢复仅在当前会话内生效', 'warn');
  }
  renderTopbar();
  renderNav();
  renderView();
  toast('已恢复初始状态（演示虚构数据）', 'ok');
}

/**
 * 导入配置文件。
 * @param {File} file 用户选择的 JSON 文件
 */
async function importConfigFile(file) {
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('文件超过 2MB 上限', 'err'); return; }
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.boards) || !Array.isArray(parsed.cards)) {
      throw new Error('配置缺少 boards / cards 数组');
    }
    state.config = parsed;
    state.customPaths.clear();
    if (!state.readonly) await commitConfig([], '导入配置');
    else toast(state.config.meta.readonlyNotice + '；导入仅在当前会话内生效', 'warn');
    renderTopbar();
    renderNav();
    renderView();
    toast('配置导入成功', 'ok');
  } catch (error) {
    toast('导入失败：' + String(error.message || error), 'err');
  }
}

/* ==================================================================
   3D：手写 Canvas 2D 透视投影的晶体锦鲤抽象体与粒子流
   ================================================================== */

const FX = {
  canvas: null, ctx: null, width: 0, height: 0, dpr: 1,
  raf: 0, startTime: 0, paused: false,
  vertices: [], faces: [], particles: [], streaks: []
};

/** 初始化晶体多面体顶点与面（抽象锦鲤：前锥＋后锥＋尾鳍＋背腹鳍）。 */
function initFXGeometry() {
  FX.vertices = [
    [-2.45, 0.00, 0.00],   // 0 鼻尖
    [0.00, 0.92, 0.00],    // 1 环上
    [0.18, 0.00, 0.98],    // 2 环前
    [0.00, -0.92, 0.00],   // 3 环下
    [0.18, 0.00, -0.98],   // 4 环后
    [1.68, 0.10, 0.00],    // 5 尾根
    [2.95, 1.20, 0.16],    // 6 尾上
    [2.95, -1.20, -0.16],  // 7 尾下
    [0.42, 1.52, -0.12],   // 8 背鳍
    [-0.18, -1.38, -0.12], // 9 腹鳍
    [1.05, 0.00, 0.72],    // 10 侧棱前
    [1.05, 0.00, -0.72]    // 11 侧棱后
  ];
  const colors = ['#F0A04B', '#9EC5CF', '#E8875A', '#9BB4D4', '#D9A3B4'];
  const defs = [
    [0, 1, 2], [0, 2, 3], [0, 3, 4], [0, 4, 1],
    [5, 2, 1], [5, 3, 2], [5, 4, 3], [5, 1, 4],
    [2, 10, 5], [5, 11, 4], [5, 6, 2], [5, 7, 2],
    [5, 6, 4], [5, 7, 4], [1, 8, 5], [3, 9, 5]
  ];
  FX.faces = defs.map((d, i) => ({ idx: d, color: colors[i % colors.length], alpha: 0.10 + (i % 4) * 0.035 }));
  FX.particles = Array.from({ length: 110 }, (_, i) => ({
    x: (Math.random() - 0.5) * 13, y: (Math.random() - 0.5) * 9, z: (Math.random() - 0.5) * 9,
    speed: 0.002 + Math.random() * 0.005, size: 0.6 + Math.random() * 1.5,
    hue: ['#F0A04B', '#9EC5CF', '#E8875A', '#ffffff'][i % 4]
  }));
  FX.streaks = Array.from({ length: 22 }, (_, i) => ({
    t: Math.random(), y: (Math.random() - 0.5) * 7, z: (Math.random() - 0.5) * 6,
    speed: 0.0007 + Math.random() * 0.0012, hue: ['#F0A04B', '#9EC5CF', '#E8875A'][i % 3]
  }));
}

/** 适配 DPR 与窗口尺寸。 */
function resizeFX() {
  if (!FX.canvas) return;
  FX.dpr = Math.min(2, window.devicePixelRatio || 1);
  FX.width = window.innerWidth;
  FX.height = window.innerHeight;
  FX.canvas.width = Math.round(FX.width * FX.dpr);
  FX.canvas.height = Math.round(FX.height * FX.dpr);
  FX.canvas.style.width = FX.width + 'px';
  FX.canvas.style.height = FX.height + 'px';
  FX.ctx.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);
}

/**
 * 三维透视投影。
 * @param {number[]} p 三维点
 * @param {number} ry Y 轴旋转
 * @param {number} rx X 轴旋转
 * @param {number} cx 屏幕中心 x
 * @param {number} cy 屏幕中心 y
 * @param {number} scale 缩放
 * @returns {{x:number,y:number,z:number,k:number}} 投影结果
 */
function project3D(p, ry, rx, cx, cy, scale) {
  const x1 = p[0] * Math.cos(ry) - p[2] * Math.sin(ry);
  const z1 = p[0] * Math.sin(ry) + p[2] * Math.cos(ry);
  const y1 = p[1] * Math.cos(rx) - z1 * Math.sin(rx);
  const z2 = p[1] * Math.sin(rx) + z1 * Math.cos(rx);
  const fov = 9;
  const k = fov / (fov + z2 + 3);
  return { x: cx + x1 * scale * k, y: cy - y1 * scale * k, z: z2, k };
}

/** 绘制一帧背景特效。 */
function drawFXFrame(time) {
  const ctx = FX.ctx;
  if (!ctx) return;
  ctx.clearRect(0, 0, FX.width, FX.height);
  const cx = FX.width * 0.76;
  const cy = FX.height * 0.50;
  const scale = Math.min(FX.width, FX.height) / 8.4;
  const ry = time * 0.00016;
  const rx = 0.26 + Math.sin(time * 0.00028) * 0.13;

  // 事件流光点：沿水平路径移动，带轻微拖尾。
  FX.streaks.forEach((s) => {
    const x = -7 + ((s.t + time * s.speed) % 1) * 14;
    const p = project3D([x, s.y, s.z], ry * 0.4, rx * 0.3, cx, cy, scale);
    const tail = project3D([x - 0.5, s.y, s.z], ry * 0.4, rx * 0.3, cx, cy, scale);
    ctx.strokeStyle = s.hue;
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 1.1 * p.k;
    ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = s.hue;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.5 * p.k, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 漂浮粒子。
  FX.particles.forEach((pt) => {
    const y = ((pt.y + time * pt.speed * 0.3) % 9) - 4.5;
    const p = project3D([pt.x, y, pt.z], ry * 0.35, rx * 0.25, cx, cy, scale);
    ctx.globalAlpha = 0.10 + 0.22 * Math.max(0, Math.min(1, (p.k - 0.45)));
    ctx.fillStyle = pt.hue;
    ctx.beginPath(); ctx.arc(p.x, p.y, pt.size * p.k, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 晶体锦鲤：按面深度排序后绘制半透明切面与折射色散描边。
  const projected = FX.vertices.map((v) => project3D(v, ry, rx, cx, cy, scale));
  const ordered = FX.faces.map((face) => {
    const z = face.idx.reduce((sum, i) => sum + projected[i].z, 0) / face.idx.length;
    return { face, z };
  }).sort((a, b) => b.z - a.z);

  ordered.forEach(({ face }) => {
    const pts = face.idx.map((i) => projected[i]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.globalAlpha = face.alpha;
    ctx.fillStyle = face.color;
    ctx.fill();
    // 色散：三次轻微偏移描边，模拟折射分光。
    const dispersions = [
      { color: '#F0A04B', dx: -1.6, dy: 0.6 },
      { color: '#9EC5CF', dx: 0, dy: 0 },
      { color: '#E8875A', dx: 1.6, dy: -0.6 }
    ];
    dispersions.forEach((d) => {
      ctx.save();
      ctx.translate(d.dx, d.dy);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      ctx.globalAlpha = 0.20;
      ctx.strokeStyle = d.color;
      ctx.lineWidth = 0.9;
      ctx.stroke();
      ctx.restore();
    });
  });
  ctx.globalAlpha = 1;
}

/** 动画循环，页面隐藏时暂停。 */
function fxLoop(timestamp) {
  if (FX.paused) return;
  drawFXFrame(timestamp || 0);
  FX.raf = window.requestAnimationFrame(fxLoop);
}

/** 启动或恢复 3D 背景。 */
function startFX() {
  if (!state.threeD || FX.paused) return;
  window.cancelAnimationFrame(FX.raf);
  FX.raf = window.requestAnimationFrame(fxLoop);
}

/** 停止 3D 背景并清屏。 */
function stopFX() {
  window.cancelAnimationFrame(FX.raf);
  FX.raf = 0;
  if (FX.ctx) FX.ctx.clearRect(0, 0, FX.width, FX.height);
}

/** 初始化背景特效。 */
function initFX() {
  FX.canvas = $('#fx-canvas');
  if (!FX.canvas) return;
  FX.ctx = FX.canvas.getContext('2d');
  initFXGeometry();
  resizeFX();
  FX.startTime = performance.now();
  window.addEventListener('resize', () => {
    resizeFX();
    if (!state.threeD) drawFXFrame(0);
  });
  document.addEventListener('visibilitychange', () => {
    FX.paused = document.hidden;
    if (FX.paused) stopFX();
    else if (state.threeD) startFX();
    else drawFXFrame(0);
  });
  if (state.threeD) startFX();
  else drawFXFrame(0);
}

/* ==================================================================
   事件绑定与启动
   ================================================================== */

/** 绑定全局事件委托。 */
function bindEvents() {
  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target) {
      if (!event.target.closest('.search-wrap')) $('#search-dropdown').classList.add('hidden');
      return;
    }
    const action = target.getAttribute('data-action');
    const id = target.getAttribute('data-id');
    const to = target.getAttribute('data-to');
    switch (action) {
      case 'goto': setView(target.getAttribute('data-view')); break;
      case 'toggle-3d':
        state.threeD = !state.threeD;
        apply3DMode();
        if (state.threeD) { startFX(); toast('3D 背景已开启', 'ok'); }
        else { stopFX(); toast('已降级为静态视图（无动画、无 3D 变换）', 'ok'); }
        break;
      case 'columns': state.columnsMode = Number(target.getAttribute('data-mode')); renderView(); break;
      case 'only-risk': state.onlyRisk = !state.onlyRisk; renderView(); break;
      case 'select-event': state.selectedEventId = id; renderView(); break;
      case 'drill-event': openDrill('event', id); break;
      case 'drill-card': openDrill('card', id); break;
      case 'drill-search': openDrill(target.getAttribute('data-type'), id); break;
      case 'open-card': state.selectedCardId = id; closeDrill(); setView('卡片详情'); break;
      case 'close-drill': closeDrill(); break;
      case 'close-modal': closeModal(); break;
      case 'submit-modal': {
        const host = $('#modal-host');
        const values = {};
        $$('[data-modal-field]', host).forEach((el) => { values[el.getAttribute('data-modal-field')] = el.value; });
        const cb = host._onSubmit;
        closeModal();
        if (cb) cb(values);
        break;
      }
      case 'transition': handleTransition(id, to); break;
      case 'accept': attemptAccept(id); break;
      case 'reject': handleTransition(id, 'Running'); break;
      case 'approval': handleApproval(id, target.getAttribute('data-decision')); break;
      case 'gate-decision': setView('审批与验收'); toast('请在对应人类门队列中处理；高风险动作不得自动完成', 'ok'); break;
      case 'console-tab': state.consoleTab = target.getAttribute('data-tab'); renderView(); break;
      case 'inject-event': injectEvent($('#inject-template') ? $('#inject-template').value : ''); break;
      case 'engine-step': pauseEngine(); runEngineStep(); break;
      case 'engine-play': state.engine.running ? pauseEngine() : playEngine(); break;
      case 'engine-reset': resetEngine(); break;
      case 'clear-trace':
        state.config.audit = [];
        commitConfig(['audit'], '清空轨迹');
        renderView();
        toast('审计轨迹已清空（规则模拟 / 虚构数据）', 'ok');
        break;
      case 'loop-step': pauseEngine(); runEngineStep(Number(target.getAttribute('data-step'))); break;
      case 'granularity':
        state.config.roles.granularity = Number(target.getAttribute('data-mode'));
        commitConfig(['roles.granularity'], '角色粒度切换');
        renderView();
        break;
      case 'ipeak-reset': {
        const defaults = { lambda: 120, S: 8, M: 1.3, K: 1.25 };
        Object.keys(defaults).forEach((k) => setPath(state.config, 'thresholds.iPeak.' + k, defaults[k]));
        setPath(state.config, 'thresholds.iPeak.peakSlots', 26);
        commitConfig(['thresholds.iPeak'], 'I_peak 恢复假设值');
        renderView();
        toast('已恢复纯假设示例参数（演示虚构数据）', 'ok');
        break;
      }
      case 'export-config': exportConfig(); break;
      case 'import-config': {
        const input = $('#import-file');
        if (input) input.click();
        break;
      }
      case 'reset-config': resetConfig(); break;
      default: break;
    }
  });

  document.addEventListener('change', (event) => {
    const el = event.target;
    if (el.id === 'board-filter') {
      state.boardFilter = el.value;
      state.selectedCardId = '';
      renderTopbar(); renderView();
      return;
    }
    if (el.id === 'template-filter') {
      state.templateFilter = el.value;
      renderTopbar(); renderView();
      return;
    }
    if (el.id === 'detail-card-select' || el.id === 'console-card-select') {
      state.selectedCardId = el.value;
      renderView();
      return;
    }
    if (el.id === 'engine-speed') {
      state.engine.speed = Number(el.value);
      const label = $('#speed-label');
      if (label) label.textContent = state.engine.speed + ' ms／步';
      if (state.engine.running) { pauseEngine(); playEngine(); }
      return;
    }
    if (el.id === 'import-file') { importConfigFile(el.files && el.files[0]); el.value = ''; return; }
    if (el.hasAttribute && el.hasAttribute('data-calc')) { applyCalcEdit(el); return; }
    if (el.hasAttribute && el.hasAttribute('data-edit')) { applyConfigEdit(el); return; }
  });

  document.addEventListener('input', (event) => {
    if (event.target.id === 'global-search') {
      state.searchQuery = event.target.value;
      renderSearchDropdown(state.searchQuery);
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      closeDrill(); closeModal();
      const host = $('#search-dropdown');
      if (host) host.classList.add('hidden');
    }
    if (event.key === 'Enter' && event.target.id === 'global-search') {
      const first = $('#search-dropdown .search-item');
      if (first) first.click();
    }
  });

  // 看板拖拽流转，与按钮流转共用同一守卫。
  document.addEventListener('dragstart', (event) => {
    const card = event.target.closest('[data-card-id]');
    if (!card) return;
    event.dataTransfer.setData('text/plain', card.getAttribute('data-card-id'));
    event.dataTransfer.effectAllowed = 'move';
  });
  document.addEventListener('dragover', (event) => {
    const col = event.target.closest('[data-col]');
    if (!col) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
  });
  document.addEventListener('drop', (event) => {
    const col = event.target.closest('[data-col]');
    if (!col) return;
    event.preventDefault();
    const cardId = event.dataTransfer.getData('text/plain');
    if (cardId) handleTransition(cardId, col.getAttribute('data-col'));
  });
}

/** 应用启动入口。 */
function bootApp() {
  detectMotionPreference();
  state.consoleTab = '规则引擎';
  state.onlyRisk = false;
  state.columnsMode = Number((state.config.ui || {}).defaultColumnsMode || 6);
  state.selectedEventId = (state.config.eventTemplates || [])[0] ? state.config.eventTemplates[0].event_id : '';
  state.selectedCardId = (filteredCards()[0] || {}).card_id || '';
  if (!Array.isArray(state.config.audit)) state.config.audit = [];
  renderTopbar();
  renderNav();
  renderView();
  bindEvents();
  initFX();
  if (state.connected) {
    fetch('/api/health').then((r) => r.json()).catch(() => {});
  } else {
    window.setTimeout(() => toast(state.config.meta.readonlyNotice + '；页面其余功能照常可用', 'warn'), 600);
  }
}

/* 对比页同步：接收 {type:'bb-goto', view:'视图名'} 后切换视图。 */
window.addEventListener('message', (event) => {
  const data = event.data || {};
  if (data.type !== 'bb-goto' || typeof setView !== 'function') return;
  const name = String(data.view || '');
  const items = (state.config.ui && state.config.ui.navItems) || [];
  if (items.indexOf(name) !== -1) setView(name);
});

bootApp();
</script>
